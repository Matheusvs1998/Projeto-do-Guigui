<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="hero">
            <div class="hero-copy">
                <span class="eyebrow">Site do Guigui</span>
                <h1>Conecte sua presença ao futuro com o Guigui.</h1>
                <p>
                    Inscreva-se para participar de uma experiência que valoriza aprendizagem,
                    colaboração e novas oportunidades. Tudo mestrado pelo mestre Guigui lindão!
                </p>
                
            </div>

            <div class="form-card">
                <h2>Formulário de inscrição</h2>
                <form id="registration-form">
                    <div class="field-group">
                        <label for="nome">Nome completo</label>
                        <input id="nome" name="nome" type="text" placeholder="Digite seu nome" maxlength="120" required>
                    </div>

                    <div class="field-group">
                        <label for="email">E-mail</label>
                        <input id="email" name="email" type="email" placeholder="seuemail@email.com" maxlength="254" required>
                    </div>

                    <div class="field-group">
                        <label for="nascimento">Data de nascimento</label>
                        <input id="nascimento" name="nascimento" type="date" required>
                    </div>

                    <div class="field-group">
                        <label for="fantasia">Nome fantasia ou apelido</label>
                        <input id="fantasia" name="fantasia" type="text" placeholder="Como você prefere ser chamado?" maxlength="80">
                    </div>

                    <button type="submit">Enviar inscrição</button>
                    <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
